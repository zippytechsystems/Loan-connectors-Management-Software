<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="commClip">
      <rect x="0" y="0" width="200" height="200" rx="36"/>
    </clipPath>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#commClip)">
    <rect width="200" height="200" fill="#064e3b"/>

    <!-- Green Financial Growth Chart in Background -->
    <path d="M0 150 Q50 140 100 110 T200 60 L200 200 L0 200 Z" fill="#047857" opacity="0.5"/>
    <polyline points="20,150 70,135 120,95 180,50" fill="none" stroke="#34d399" stroke-width="3"/>
    
    <!-- Upward Trend Arrow -->
    <polygon points="180,50 165,55 178,65" fill="#34d399"/>

    <!-- Stack of Gold Coins on Left -->
    <!-- Coin 1 -->
    <ellipse cx="65" cy="155" rx="28" ry="11" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="65" cy="144" rx="28" ry="11" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="65" cy="133" rx="28" ry="11" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="65" cy="122" rx="28" ry="11" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <!-- Rupee on Top Coin -->
    <text x="65" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#78350f">₹</text>

    <!-- Stack of Gold Coins on Right -->
    <ellipse cx="135" cy="160" rx="24" ry="9" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="135" cy="150" rx="24" ry="9" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="135" cy="140" rx="24" ry="9" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="135" cy="130" rx="24" ry="9" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="135" cy="120" rx="24" ry="9" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="135" cy="110" rx="24" ry="9" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <text x="135" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#78350f">₹</text>

    <!-- Commission Slab Percentage Badge Floating -->
    <rect x="75" y="40" width="50" height="26" rx="13" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <text x="100" y="57" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">+2.5%</text>
  </g>
</svg>
