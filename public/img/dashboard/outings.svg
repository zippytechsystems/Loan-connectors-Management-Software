<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="200" height="200" rx="36"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect width="200" height="200" fill="#f8fafc"/>
    <!-- Calendar Grid Lines -->
    <rect x="15" y="15" width="170" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <line x1="15" y1="95" x2="185" y2="95" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="100" y1="15" x2="100" y2="185" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Day 17 Large Bold Text -->
    <text x="35" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0f172a">17</text>

    <!-- Red Vacation Banner / Text angled -->
    <g transform="rotate(-8 100 100)">
      <rect x="15" y="80" width="165" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="97" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#dc2626" letter-spacing="2">VACATION</text>
    </g>

    <!-- Day 24 Large Bold Text -->
    <text x="110" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0f172a">24</text>

    <!-- Hand & Pencil marking vacation -->
    <path d="M145 75 L180 40 L195 55 L160 90 Z" fill="#f59e0b"/>
    <polygon points="145,75 140,90 155,85" fill="#fde68a"/>
    <polygon points="140,90 138,92 143,89" fill="#0f172a"/>
    <rect x="175" y="35" width="22" height="12" rx="3" fill="#ec4899" transform="rotate(45 175 35)"/>
  </g>
</svg>
