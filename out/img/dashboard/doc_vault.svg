<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="vaultClip">
      <rect x="0" y="0" width="200" height="200" rx="36"/>
    </clipPath>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#vaultClip)">
    <rect width="200" height="200" fill="#0f172a"/>
    <rect width="200" height="200" fill="url(#shieldGlow)" opacity="0.4"/>

    <!-- Vault Steel Door Pattern in Background -->
    <circle cx="100" cy="100" r="75" fill="none" stroke="#334155" stroke-width="4"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Central Glowing Security Shield -->
    <path d="M100 35 L145 55 C145 105 100 145 100 145 C100 145 55 105 55 55 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
    <path d="M100 45 L135 62 C135 100 100 135 100 135 C100 135 65 100 65 62 Z" fill="#0369a1"/>

    <!-- Gold Brass Padlock inside Shield -->
    <rect x="85" y="80" width="30" height="26" rx="6" fill="#facc15" stroke="#eab308" stroke-width="2"/>
    <path d="M90 80 L90 70 C90 62 110 62 110 70 L110 80" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="91" r="3.5" fill="#78350f"/>
    <line x1="100" y1="94" x2="100" y2="99" stroke="#78350f" stroke-width="2.5"/>

    <!-- Verified Document Sheet Emerging -->
    <rect x="75" y="125" width="50" height="45" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="82" y1="135" x2="118" y2="135" stroke="#38bdf8" stroke-width="2"/>
    <line x1="82" y1="145" x2="112" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="82" y1="155" x2="105" y2="155" stroke="#22c55e" stroke-width="1.5"/>

    <!-- AES-256 Text -->
    <text x="100" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#38bdf8" letter-spacing="1.5">AES-256 VAULT</text>
  </g>
</svg>
