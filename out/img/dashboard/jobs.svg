<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="cityWindow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <!-- Background High-Rise Corporate Office -->
  <rect width="200" height="200" rx="20" fill="url(#officeBg)"/>
  
  <!-- Window Glass Panels Background with Skyscraper outlines -->
  <rect x="25" y="15" width="150" height="90" rx="4" fill="url(#cityWindow)" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="75" y1="15" x2="75" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <line x1="125" y1="15" x2="125" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <!-- Skyscrapers -->
  <rect x="40" y="45" width="22" height="60" fill="rgba(148,163,184,0.4)"/>
  <rect x="85" y="30" width="30" height="75" fill="rgba(148,163,184,0.4)"/>
  <rect x="135" y="55" width="25" height="50" fill="rgba(148,163,184,0.4)"/>
  
  <!-- Executive 1 Left (Loan Connector Agent) -->
  <circle cx="56" cy="85" r="14" fill="#fed7aa"/>
  <path d="M42 82 Q56 65 70 82 Z" fill="#1e293b"/>
  <path d="M40 125 C40 105 72 105 72 125 Z" fill="#3b82f6"/>
  <!-- Arm extending forward for handshake -->
  <path d="M68 112 Q85 116 96 112" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Executive 2 Right (Lender Credit Manager) -->
  <circle cx="144" cy="85" r="14" fill="#fed7aa"/>
  <path d="M130 82 Q144 65 158 82 Z" fill="#475569"/>
  <path d="M128 125 C128 105 160 105 160 125 Z" fill="#0f172a"/>
  <!-- Arm extending forward for handshake -->
  <path d="M132 112 Q115 116 104 112" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Handshake Clasp in Center -->
  <circle cx="100" cy="112" r="7" fill="#fed7aa"/>
  <path d="M96 110 L104 114" stroke="#d97706" stroke-width="2"/>
  
  <!-- Sleek Modern Meeting Desk -->
  <path d="M15 130 L185 130 L170 195 L30 195 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- Laptop on Desk -->
  <polygon points="120,150 155,150 160,175 115,175" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="122" y="125" width="30" height="24" rx="2" fill="#0f172a" stroke="#64748b"/>
  <rect x="125" y="128" width="24" height="18" fill="#38bdf8"/>
  
  <!-- Plant on Desk Left -->
  <path d="M35 150 Q30 135 38 125 Q42 140 38 150" fill="#10b981"/>
  <path d="M40 150 Q48 135 44 125 Q40 140 42 150" fill="#059669"/>
  <polygon points="32,150 44,150 41,165 35,165" fill="#f59e0b"/>
</svg>
