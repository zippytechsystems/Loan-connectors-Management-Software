<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="payBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="payShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Warm Soft Gradient -->
  <rect width="200" height="200" rx="20" fill="url(#payBg)"/>
  
  <!-- Floating Payment Action Icons in Background -->
  <circle cx="35" cy="45" r="10" fill="#38bdf8" opacity="0.4"/>
  <circle cx="165" cy="50" r="12" fill="#ec4899" opacity="0.3"/>
  <circle cx="170" cy="140" r="10" fill="#10b981" opacity="0.4"/>
  <circle cx="30" cy="145" r="9" fill="#f59e0b" opacity="0.4"/>
  
  <!-- Hands holding phone from bottom -->
  <!-- Left Hand -->
  <path d="M40 200 C30 160 55 130 65 110 L80 120 C75 145 55 175 60 200 Z" fill="#fdba74"/>
  <!-- Right Hand -->
  <path d="M160 200 C170 160 145 130 135 110 L120 120 C125 145 145 175 140 200 Z" fill="#fdba74"/>
  
  <!-- Smartphone in Center -->
  <g filter="url(#payShadow)">
    <rect x="62" y="24" width="76" height="152" rx="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="66" y="32" width="68" height="136" rx="10" fill="#f8fafc"/>
    
    <!-- Phone Screen Header -->
    <rect x="66" y="32" width="68" height="42" rx="6" fill="url(#phoneScreen)"/>
    <!-- Speaker slit -->
    <rect x="92" y="27" width="16" height="2" rx="1" fill="#64748b"/>
    
    <!-- NFC Contactless Waves on Top -->
    <path d="M92 48 A 12 12 0 0 1 108 48" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M88 44 A 18 18 0 0 1 112 44" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M84 40 A 24 24 0 0 1 116 40" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Transaction Check & Amount -->
    <rect x="74" y="85" width="52" height="18" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="100" y="97" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#065f46" text-anchor="middle">₹ 42,500</text>
    <text x="100" y="112" font-family="Arial, sans-serif" font-size="5.5" font-weight="bold" fill="#0284c7" text-anchor="middle">NEFT SETTLED</text>
    
    <!-- Pay Success Button -->
    <rect x="74" y="122" width="52" height="14" rx="4" fill="#22c55e"/>
    <text x="100" y="132" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">PAID ✓</text>
    
    <!-- Mini Credit Card Overlay -->
    <rect x="72" y="142" width="56" height="22" rx="3" fill="url(#cardGrad)"/>
    <rect x="76" y="146" width="8" height="6" rx="1" fill="#facc15"/>
    <circle cx="118" cy="154" r="3" fill="rgba(255,255,255,0.6)"/>
    <circle cx="122" cy="154" r="3" fill="rgba(255,255,255,0.6)"/>
  </g>
</svg>
