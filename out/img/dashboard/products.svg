<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="prodClip">
      <rect x="0" y="0" width="200" height="200" rx="36"/>
    </clipPath>
    <linearGradient id="prodBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#prodClip)">
    <rect width="200" height="200" fill="url(#prodBg)"/>

    <!-- Bank / Factory Building Silhouette in Background -->
    <rect x="25" y="60" width="50" height="90" fill="#4338ca" opacity="0.6"/>
    <polygon points="50,35 15,60 85,60" fill="#6366f1" opacity="0.6"/>
    <!-- Bank Columns -->
    <line x1="33" y1="65" x2="33" y2="135" stroke="#312e81" stroke-width="3"/>
    <line x1="47" y1="65" x2="47" y2="135" stroke="#312e81" stroke-width="3"/>
    <line x1="61" y1="65" x2="61" y2="135" stroke="#312e81" stroke-width="3"/>

    <!-- Industrial Machinery / Factory Cog in Center -->
    <circle cx="130" cy="90" r="34" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
    <circle cx="130" cy="90" r="16" fill="#1e1b4b"/>
    <!-- Cog Teeth -->
    <rect x="126" y="50" width="8" height="12" rx="2" fill="#d97706"/>
    <rect x="126" y="118" width="8" height="12" rx="2" fill="#d97706"/>
    <rect x="90" y="86" width="12" height="8" rx="2" fill="#d97706"/>
    <rect x="158" y="86" width="12" height="8" rx="2" fill="#d97706"/>

    <!-- Loan Product Badges at Bottom -->
    <rect x="20" y="145" width="75" height="24" rx="12" fill="#38bdf8"/>
    <text x="57" y="161" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#0f172a">MSME LOANS</text>

    <rect x="105" y="145" width="75" height="24" rx="12" fill="#a855f7"/>
    <text x="142" y="161" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#ffffff">LAP &amp; WC</text>
  </g>
</svg>
