<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="holoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neonBlur">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Tech Laboratory -->
  <rect width="200" height="200" rx="20" fill="url(#aiBg)"/>
  
  <!-- Circuit Grid Background Lines -->
  <path d="M10 50 H190 M10 100 H190 M10 150 H190 M50 10 V190 M100 10 V190 M150 10 V190" stroke="rgba(56,189,248,0.12)" stroke-width="1"/>
  
  <!-- Operator Profile on Left -->
  <circle cx="48" cy="95" r="16" fill="#fed7aa"/>
  <path d="M30 92 Q48 65 65 92 Z" fill="#334155"/>
  <path d="M26 138 C26 118 70 118 70 138 Z" fill="#1e293b"/>
  <!-- Headset / Glasses -->
  <path d="M42 90 A 10 10 0 0 1 54 90" stroke="#0ea5e9" stroke-width="2" fill="none"/>
  
  <!-- Futuristic Glowing Tablet / Terminal in Hands -->
  <polygon points="45,150 95,130 95,175 45,190" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="55" y1="145" x2="85" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <line x1="55" y1="155" x2="85" y2="145" stroke="#38bdf8" stroke-width="2"/>
  <line x1="55" y1="165" x2="80" y2="157" stroke="#34d399" stroke-width="2"/>
  
  <!-- Glowing Cyan AI Hologram Window -->
  <g filter="url(#neonBlur)">
    <!-- Transparent Floating Screen -->
    <rect x="90" y="30" width="95" height="110" rx="8" fill="rgba(14,165,233,0.15)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- AI News Header -->
    <text x="100" y="46" font-family="monospace" font-size="7" font-weight="bold" fill="#38bdf8">AI UNDERWRITER</text>
    <rect x="100" y="52" width="75" height="1" fill="#38bdf8"/>
    
    <!-- Hologram Robot Avatar -->
    <circle cx="150" cy="78" r="14" fill="rgba(56,189,248,0.3)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Robot Eyes -->
    <circle cx="145" cy="76" r="2.5" fill="#38bdf8"/>
    <circle cx="155" cy="76" r="2.5" fill="#38bdf8"/>
    <rect x="146" y="83" width="8" height="2" rx="1" fill="#38bdf8"/>
    <!-- Antenna -->
    <line x1="150" y1="64" x2="150" y2="58" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="150" cy="56" r="2" fill="#34d399"/>
    
    <!-- Credit Analytics Telemetry Charts -->
    <rect x="98" y="60" width="36" height="4" rx="1" fill="#34d399"/>
    <text x="98" y="72" font-family="monospace" font-size="5" fill="#38bdf8">CIBIL: 785</text>
    <text x="98" y="80" font-family="monospace" font-size="5" fill="#38bdf8">DTI: 32%</text>
    <text x="98" y="88" font-family="monospace" font-size="5" fill="#34d399">PASS (94%)</text>
    
    <!-- Soundwaves / Holographic Pulse -->
    <path d="M100 115 Q115 105 130 115 T160 115 T180 115" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M100 125 Q120 135 140 125 T175 125" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  </g>
  
  <!-- Holographic Beam Base Emitter -->
  <polygon points="95,130 185,130 140,165 95,165" fill="url(#holoGlow)" opacity="0.3"/>
</svg>
