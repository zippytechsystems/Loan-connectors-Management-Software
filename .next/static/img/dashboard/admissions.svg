<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="admBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Room / Bookshelf wall -->
  <rect width="200" height="200" rx="20" fill="url(#admBg)"/>
  
  <!-- Bookshelf shelves in background -->
  <line x1="20" y1="40" x2="180" y2="40" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <line x1="20" y1="70" x2="180" y2="70" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- Books -->
  <rect x="30" y="24" width="8" height="16" fill="#38bdf8"/>
  <rect x="40" y="22" width="10" height="18" fill="#ec4899"/>
  <rect x="52" y="26" width="7" height="14" fill="#a855f7"/>
  <rect x="140" y="20" width="12" height="20" fill="#10b981"/>
  <rect x="154" y="25" width="8" height="15" fill="#facc15"/>
  
  <!-- Executive 1 Left (Reviewer) -->
  <circle cx="56" cy="95" r="14" fill="#fed7aa"/>
  <path d="M42 95 Q56 75 70 95 Z" fill="#7c2d12"/>
  <path d="M38 128 C38 114 74 114 74 128 Z" fill="#ea580c"/>
  
  <!-- Executive 2 Center (Senior Underwriter) -->
  <circle cx="100" cy="85" r="16" fill="#fde68a"/>
  <path d="M84 82 Q100 64 116 82 Z" fill="#1e293b"/>
  <!-- Glasses -->
  <rect x="91" y="83" width="7" height="5" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="102" y="83" width="7" height="5" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="98" y1="85" x2="102" y2="85" stroke="#0f172a" stroke-width="1.5"/>
  <path d="M80 125 C80 108 120 108 120 125 Z" fill="#0284c7"/>
  
  <!-- Executive 3 Right (Lender Liaison) -->
  <circle cx="144" cy="95" r="14" fill="#fed7aa"/>
  <path d="M130 92 Q144 75 158 92 Z" fill="#064e3b"/>
  <path d="M126 128 C126 114 162 114 162 128 Z" fill="#047857"/>

  <!-- Large Conference Desk -->
  <path d="M10 135 L190 135 L175 200 L25 200 Z" fill="url(#tableGrad)" stroke="#b45309" stroke-width="2"/>
  
  <!-- Review Documents / Sanction Agreements on Desk -->
  <g transform="rotate(-6 65 160)">
    <rect x="40" y="145" width="46" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="45" y1="154" x2="75" y2="154" stroke="#94a3b8" stroke-width="2"/>
    <line x1="45" y1="162" x2="80" y2="162" stroke="#94a3b8" stroke-width="2"/>
    <line x1="45" y1="170" x2="70" y2="170" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <g transform="rotate(4 135 160)">
    <rect x="110" y="145" width="50" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="116" y="152" width="20" height="6" rx="1" fill="#0284c7"/>
    <line x1="116" y1="164" x2="150" y2="164" stroke="#94a3b8" stroke-width="2"/>
    <line x1="116" y1="172" x2="145" y2="172" stroke="#94a3b8" stroke-width="2"/>
  </g>
  
  <!-- Gold Sanction Seal -->
  <circle cx="100" cy="165" r="10" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="100" y="168" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#78350f" text-anchor="middle">✓</text>
</svg>
