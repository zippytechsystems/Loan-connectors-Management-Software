<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="studBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Background Study Room / Library -->
  <rect width="200" height="200" rx="20" fill="url(#studBg)"/>
  
  <!-- Brick Wall pattern hint in background -->
  <line x1="20" y1="35" x2="180" y2="35" stroke="rgba(100,116,139,0.2)" stroke-width="1"/>
  <line x1="20" y1="55" x2="180" y2="55" stroke="rgba(100,116,139,0.2)" stroke-width="1"/>
  
  <!-- Underwriter / Reviewer Head (Looking Down at Paper) -->
  <circle cx="100" cy="72" r="17" fill="#fed7aa"/>
  <!-- Dark curly hair -->
  <path d="M82 66 Q100 42 118 66 Z" fill="#18181b"/>
  
  <!-- Plaid Shirt Body -->
  <path d="M70 120 C70 95 130 95 130 120 L145 180 L55 180 Z" fill="#3b82f6"/>
  <!-- Plaid lines -->
  <line x1="88" y1="98" x2="88" y2="175" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="112" y1="98" x2="112" y2="175" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="65" y1="135" x2="135" y2="135" stroke="#1d4ed8" stroke-width="2"/>
  
  <!-- Desk surface -->
  <polygon points="10,135 190,135 175,200 25,200" fill="url(#deskGrad)" stroke="#78350f" stroke-width="1.5"/>

  <!-- Open Spiral Notebook / KYC Review Document -->
  <g transform="translate(62, 120)">
    <!-- Notebook Paper -->
    <rect x="0" y="0" width="76" height="60" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="38" y1="0" x2="38" y2="60" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Ruled lines -->
    <line x1="6" y1="12" x2="32" y2="12" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="6" y1="22" x2="32" y2="22" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="6" y1="32" x2="32" y2="32" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="6" y1="42" x2="32" y2="42" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <line x1="44" y1="12" x2="70" y2="12" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="44" y1="22" x2="70" y2="22" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="44" y1="32" x2="70" y2="32" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="44" y1="42" x2="70" y2="42" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Verified Stamp / Checkmark -->
    <circle cx="56" cy="30" r="10" fill="none" stroke="#22c55e" stroke-width="2"/>
    <path d="M51 30 L55 34 L62 26" stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Right Arm & Hand Holding Yellow Pencil -->
  <path d="M125 118 Q140 135 125 150" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="122" cy="150" r="6" fill="#fed7aa"/>
  <!-- Pencil writing on page -->
  <line x1="122" y1="148" x2="108" y2="162" stroke="#eab308" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="108,162 104,166 109,165" fill="#0f172a"/>
</svg>
