<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ttBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="ttShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Desk -->
  <rect width="200" height="200" rx="20" fill="url(#ttBg)"/>
  
  <!-- Sticky Note Left -->
  <rect x="18" y="70" width="28" height="28" rx="3" fill="#bef264" transform="rotate(-6 32 84)"/>
  <rect x="20" y="105" width="26" height="26" rx="3" fill="#fde047" transform="rotate(4 33 118)"/>
  
  <!-- Timetable Sheet -->
  <g filter="url(#ttShadow)">
    <rect x="54" y="24" width="100" height="152" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="74" y="34" width="60" height="8" rx="2" fill="#0284c7"/>
    <text x="104" y="40" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">TIME TABLE / SLA</text>
    
    <!-- Table Grid -->
    <rect x="64" y="50" width="80" height="114" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Horizontal Lines -->
    <line x1="64" y1="66" x2="144" y2="66" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="64" y1="82" x2="144" y2="82" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="64" y1="98" x2="144" y2="98" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="64" y1="114" x2="144" y2="114" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="64" y1="130" x2="144" y2="130" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="64" y1="146" x2="144" y2="146" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Vertical Lines -->
    <line x1="84" y1="50" x2="84" y2="164" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="104" y1="50" x2="104" y2="164" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="124" y1="50" x2="124" y2="164" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Active Tasks Pills -->
    <rect x="86" y="53" width="16" height="10" rx="2" fill="#38bdf8"/>
    <rect x="106" y="69" width="16" height="10" rx="2" fill="#34d399"/>
    <rect x="126" y="85" width="16" height="10" rx="2" fill="#fbbf24"/>
    <rect x="86" y="101" width="16" height="10" rx="2" fill="#f87171"/>
  </g>
  
  <!-- Retro Alarm Clock Top-Left -->
  <g filter="url(#ttShadow)">
    <circle cx="38" cy="46" r="18" fill="url(#clockGrad)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="38" cy="46" r="14" fill="#ffffff"/>
    <!-- Clock Hands -->
    <line x1="38" y1="46" x2="38" y2="38" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="46" x2="44" y2="46" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Clock Bell Ears & Feet -->
    <circle cx="27" cy="32" r="5" fill="#64748b"/>
    <circle cx="49" cy="32" r="5" fill="#64748b"/>
    <line x1="29" y1="60" x2="25" y2="66" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="47" y1="60" x2="51" y2="66" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Pen on right -->
  <line x1="168" y1="45" x2="152" y2="155" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <polygon points="152,155 149,165 156,162" fill="#0284c7"/>
</svg>
