<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="10%%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Background Corridor / Notice Wall -->
  <rect width="200" height="200" rx="20" fill="url(#hallBg)"/>
  
  <!-- Large Wooden Bulletin Board -->
  <rect x="25" y="18" width="150" height="110" rx="8" fill="url(#boardGrad)" stroke="#451a03" stroke-width="3"/>
  <!-- Cork Board Area -->
  <rect x="32" y="25" width="136" height="96" rx="4" fill="#d97706"/>
  
  <!-- Pinned Circular Memos on Board -->
  <!-- Memo 1 Left: RBI Circular -->
  <g transform="rotate(-4 56 60)">
    <rect x="38" y="34" width="42" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="59" cy="38" r="2.5" fill="#ef4444"/> <!-- Red Pin -->
    <rect x="42" y="44" width="22" height="4" rx="1" fill="#0284c7"/>
    <line x1="42" y1="53" x2="74" y2="53" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="42" y1="60" x2="74" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="42" y1="67" x2="68" y2="67" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="42" y="77" font-family="Arial, sans-serif" font-size="4.5" font-weight="bold" fill="#0369a1">RBI 2026</text>
  </g>

  <!-- Memo 2 Center: TSIIC Nacharam Scheme -->
  <g transform="rotate(2 100 65)">
    <rect x="85" y="32" width="46" height="58" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="108" cy="36" r="2.5" fill="#3b82f6"/> <!-- Blue Pin -->
    <rect x="90" y="42" width="28" height="5" rx="1" fill="#16a34a"/>
    <line x1="90" y1="52" x2="125" y2="52" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="59" x2="125" y2="59" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="66" x2="125" y2="66" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="73" x2="115" y2="73" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Memo 3 Right: Slabs Notice -->
  <g transform="rotate(-2 145 60)">
    <rect x="135" y="40" width="30" height="40" rx="2" fill="#fef08a" stroke="#fde047"/>
    <circle cx="150" cy="44" r="2" fill="#eab308"/> <!-- Yellow Pin -->
    <line x1="138" y1="50" x2="162" y2="50" stroke="#a16207" stroke-width="1.5"/>
    <line x1="138" y1="57" x2="162" y2="57" stroke="#a16207" stroke-width="1.5"/>
    <line x1="138" y1="64" x2="155" y2="64" stroke="#a16207" stroke-width="1.5"/>
  </g>

  <!-- People in Foreground Looking Up at Board -->
  <!-- Person 1 (Woman with Cyan Scarf Looking Up) -->
  <g>
    <circle cx="100" cy="140" r="17" fill="#fed7aa"/>
    <path d="M84 135 Q100 110 116 135 Z" fill="#1e1b4b"/>
    <!-- Cyan Scarf -->
    <path d="M82 152 C82 145 118 145 118 152 L124 175 C110 178 90 178 76 175 Z" fill="#06b6d4"/>
    <path d="M72 175 C72 160 128 160 128 175 L132 200 L68 200 Z" fill="#3b82f6"/>
  </g>

  <!-- Person 2 Left (Man Profile Looking at Left Memo) -->
  <g>
    <circle cx="60" cy="145" r="16" fill="#fed7aa"/>
    <path d="M46 140 Q60 118 74 140 Z" fill="#451a03"/>
    <path d="M40 175 C40 160 80 160 80 175 L85 200 L35 200 Z" fill="#b91c1c"/>
  </g>
</svg>
